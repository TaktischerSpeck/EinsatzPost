name: Check EinsatzPost
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional pull request number to retest
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.pull_request || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.revision.outputs.ref }}
      head: ${{ steps.revision.outputs.head }}
      base: ${{ steps.revision.outputs.base }}
      pr: ${{ steps.revision.outputs.pr }}
      promote: ${{ steps.revision.outputs.promote }}
    steps:
      - uses: actions/github-script@v8
        id: revision
        with:
          script: |
            const repo = context.repo;
            const number = context.payload.pull_request?.number || Number(context.payload.inputs?.pull_request || 0);
            if (number) {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
              if (pr.state !== 'open') { core.info('Pull request is no longer open; nothing to test'); return; }
              const base = await github.rest.repos.getBranch({ ...repo, branch: pr.base.ref });
              // PR base.sha and synthetic merge refs can remain stale after bot merges.
              // Build and test the integration from the current branch tips instead.
              core.setOutput('ref', pr.head.sha);
              core.setOutput('head', pr.head.sha);
              core.setOutput('base', base.data.commit.sha);
              core.setOutput('pr', number);
            } else {
              core.setOutput('ref', context.sha);
              core.setOutput('head', context.sha);
              if (context.ref === 'refs/heads/dev') {
                const main = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
                core.setOutput('base', main.data.commit.sha);
                core.setOutput('promote', 'true');
              }
            }
  test:
    needs: prepare
    if: needs.prepare.outputs.ref != ''
    outputs:
      tree: ${{ steps.integration.outputs.tree }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test integration with the current target branch
        if: needs.prepare.outputs.base != ''
        env:
          MAIN_SHA: ${{ needs.prepare.outputs.base }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$MAIN_SHA"
      - name: Record the tested integration tree
        id: integration
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: '${{ matrix.node }}'
      - run: npm run check
      - run: npm test
  automate:
    needs: [prepare, test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: repository-squash-merges
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/github-script@v8
        env:
          TESTED_TREE: ${{ needs.test.outputs.tree }}
          TESTED_HEAD: ${{ needs.prepare.outputs.head }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          PROMOTE: ${{ needs.prepare.outputs.promote }}
        with:
          script: |
            const repo = context.repo;
            const dispatch = async (number) => github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'check.yml', ref: 'dev',
              inputs: number ? { pull_request: String(number) } : {}
            });
            const number = Number(process.env.PR_NUMBER || 0);
            if (number) {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: number });
              const feature = pr.base.ref === 'dev' && pr.head.ref.startsWith('feature/');
              const release = pr.base.ref === 'main' && pr.head.ref === 'dev';
              if (pr.draft || pr.state !== 'open' || pr.head.repo.full_name !== context.payload.repository.full_name || (!feature && !release)) {
                core.info('This pull request is not eligible for automatic merging'); return;
              }
              const base = await github.rest.repos.getBranch({ ...repo, branch: pr.base.ref });
              if (pr.head.sha !== process.env.TESTED_HEAD || base.data.commit.sha !== process.env.TESTED_BASE) {
                core.info('Branch changed during testing; dispatching a fresh integration test');
                await dispatch(number); return;
              }
              const result = await github.rest.pulls.merge({ ...repo, pull_number: number, sha: pr.head.sha, merge_method: 'squash' });
              if (!result.data.merged) throw new Error(result.data.message);
              if (feature) {
                // Never delete a branch that received new work after the tested commit.
                const head = await github.rest.git.getRef({ ...repo, ref: 'heads/' + pr.head.ref });
                if (head.data.object.sha === pr.head.sha) await github.rest.git.deleteRef({ ...repo, ref: 'heads/' + pr.head.ref });
                // GITHUB_TOKEN merges do not trigger push workflows, so dispatch explicitly.
                await dispatch();
              } else {
                await github.rest.repos.merge({ ...repo, base: 'dev', head: result.data.sha, commit_message: 'Sync main into dev after squash promotion' });
              }
            } else if (process.env.PROMOTE === 'true') {
              const dev = await github.rest.repos.getBranch({ ...repo, branch: 'dev' });
              const main = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
              if (dev.data.commit.sha !== process.env.TESTED_HEAD || main.data.commit.sha !== process.env.TESTED_BASE) {
                core.info('Branch changed during testing; dispatching fresh tests'); await dispatch(); return;
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: main.data.commit.sha + '...' + dev.data.commit.sha });
              if (!comparison.data.files?.length) { core.info('No changes to promote'); return; }
              // Create the tested integration tree on a temporary branch without changing main.
              // This avoids requiring permission for Actions to create pull requests.
              const temporary = 'ci/integration-' + context.runId;
              await github.rest.git.createRef({ ...repo, ref: 'refs/heads/' + temporary, sha: main.data.commit.sha });
              try {
                const integration = await github.rest.repos.merge({ ...repo, base: temporary, head: dev.data.commit.sha });
                const commit = integration.data.sha
                  ? (await github.rest.git.getCommit({ ...repo, commit_sha: integration.data.sha })).data
                  : (await github.rest.git.getCommit({ ...repo, commit_sha: main.data.commit.sha })).data;
                if (commit.tree.sha !== process.env.TESTED_TREE) throw new Error('Integration tree differs from the tested tree; refusing promotion');
                const squash = await github.rest.git.createCommit({
                  ...repo, message: 'Promote tested dev changes to main\n\nValidated on Node.js 22 and 24. Source: ' + dev.data.commit.sha,
                  tree: commit.tree.sha, parents: [main.data.commit.sha]
                });
                // Fast-forward only: concurrent main changes cause rejection instead of overwriting.
                await github.rest.git.updateRef({ ...repo, ref: 'heads/main', sha: squash.data.sha, force: false });
                await github.rest.repos.merge({ ...repo, base: 'dev', head: squash.data.sha, commit_message: 'Sync main into dev after squash promotion' });
                core.info('Promoted tested dev tree as squash commit ' + squash.data.sha);
              } finally {
                await github.rest.git.deleteRef({ ...repo, ref: 'heads/' + temporary });
              }
            }
